# Production : docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# Sur vlldnt.fr : déployé par deploy-project.sh (voir docs/deployment.md).
# Variables obligatoires dans .env : POSTGRES_PASSWORD, JWT_SECRET (32 caractères minimum),
# FRONTEND_URL (URL publique du site) et les paramètres SMTP (MAIL_*).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est obligatoire}
      POSTGRES_DB: ${POSTGRES_DB:-portail}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      target: prod
    restart: unless-stopped
    env_file: .env
    environment:
      ENVIRONMENT: production
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET est obligatoire}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-portail}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-portail}
      MAIL_BACKEND: smtp
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./frontend
      target: prod
    restart: unless-stopped
    ports:
      # Loopback uniquement : le nginx du VPS est le seul point d'entrée public.
      - "127.0.0.1:${WEB_PORT:-8087}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db_data:
  uploads:
